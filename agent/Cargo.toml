[package]
name = "nstatus-agent"
version = "1.0.6"
edition = "2021"
license = "MIT"
description = "NStatus cross-platform metrics agent"

[[bin]]
name = "nstatus-metrics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
sysinfo = "=0.30.13"
rustls-rustcrypto = "0.0.2-alpha"
ureq = { version = "3.3.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
