[package]
name = "nstatus-agent"
version = "1.0.41"
edition = "2021"
license = "MIT"
description = "NIE-SLA cross-platform metrics agent"

[[bin]]
name = "nstatus-metrics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
sysinfo = "=0.30.13"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "rustls-webpki-roots"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

