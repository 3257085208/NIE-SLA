[package]
name = "nie-sla-agent"
version = "1.1.49"
edition = "2021"
license = "MIT"
description = "NIE-SLA cross-platform metrics agent"

[[bin]]
name = "nie-sla-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
sysinfo = "=0.30.13"
meow-common = "0.21.2"
meow-proxy = { version = "0.21.2", default-features = false, features = ["ss", "trojan", "vless", "vless-vision", "vmess", "hysteria2", "snell", "anytls"] }
meow-transport = { version = "0.21.2", default-features = false, features = ["tls", "ws", "grpc", "h2", "httpupgrade"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "rustls-webpki-roots"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
