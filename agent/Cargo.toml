[package]
name = "nstatus-agent"
version = "1.0.40"
edition = "2021"
license = "MIT"
description = "NIE-SLA cross-platform metrics agent"

[[bin]]
name = "nstatus-metrics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
surge-ping = "0.9"
sysinfo = "=0.30.13"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "rustls-webpki-roots"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

