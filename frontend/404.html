<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <title>页面不存在 - 聶.NET</title>
    <style>
      :root { color-scheme: light; --ink: #101827; --muted: #64748b; --line: #d9e2e8; --green: #159754; --paper: #fff; --bg: #f4f8fc; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { margin: 0; color: var(--ink); background: var(--bg); font: 16px/1.55 "Varela Round", "Noto Sans SC", sans-serif; }
      .not-found-shell { width: min(980px, calc(100vw - 42px)); margin: 0 auto; padding: 28px 0 48px; }
      .not-found-header { display: flex; align-items: center; justify-content: space-between; min-height: 68px; border-bottom: 1px solid var(--line); }
      .not-found-brand { color: #4f9b58; font-size: 28px; font-weight: 700; text-decoration: none; }
      .not-found-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 320px); gap: 42px; align-items: center; min-height: 62vh; }
      .not-found-code { color: var(--green); font: 700 clamp(72px, 13vw, 150px)/.9 "Varela Round", sans-serif; letter-spacing: .02em; }
      h1 { margin: 18px 0 8px; font-size: clamp(28px, 4vw, 44px); line-height: 1.1; }
      p { max-width: 480px; margin: 0; color: var(--muted); }
      .not-found-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
      .not-found-actions a { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border: 1px solid var(--line); color: var(--ink); background: var(--paper); text-decoration: none; }
      .not-found-actions a:first-child { color: #fff; background: var(--green); border-color: var(--green); }
      .not-found-mark { display: grid; place-items: center; width: min(100%, 300px); aspect-ratio: 1; margin-left: auto; color: var(--green); background: #e8f7ef; border: 1px solid #b8dfc6; border-radius: 50%; font-size: 90px; font-weight: 700; }
      @media (max-width: 640px) { .not-found-shell { width: min(100% - 28px, 520px); padding-top: 14px; } .not-found-main { grid-template-columns: 1fr; gap: 22px; min-height: auto; padding: 18vh 0 12vh; } .not-found-mark { width: 150px; margin: 0; font-size: 48px; order: -1; } }
    </style>
  </head>
  <body>
    <div class="not-found-shell">
      <header class="not-found-header"><a class="not-found-brand" href="/">聶.NET</a><span aria-hidden="true">状态监控</span></header>
      <main class="not-found-main">
        <div><div class="not-found-code">404</div><h1>页面不存在</h1><p>请求的地址无对应页面，可能已经移动或暂时不可用。</p><div class="not-found-actions"><a href="/">返回状态页</a><a href="/admin.html">管理入口</a></div></div>
        <div class="not-found-mark" aria-hidden="true">?</div>
      </main>
    </div>
  </body>
</html>
