name = "nstatus"
main = "src/index.js"
compatibility_date = "2026-06-17"
workers_dev = true
[triggers]
crons = ["* * * * *"]

[vars]
PUBLIC_SITE_NAME = "聶.NET"
ADMIN_USERNAME = "admin"
ALLOWED_ORIGIN = "https://status.example.com"
PUBLIC_SITE_ORIGIN = "https://status.example.com"
PUBLIC_WORKER_URL = "https://api.example.com"
PUBLIC_AGENT_API_BASE = "https://api.example.com"
TIMEZONE_OFFSET_MINUTES = "480"
CONCURRENCY = "40"
MAX_TARGETS_PER_RUN = "60"
CHECKS_DEFAULT_LIMIT = "864"
CHECKS_WINDOW_HOURS = "72"
INCIDENTS_TO_D1 = "true"
PUBLIC_MASK_IPS = "true"
AGENT_METRICS_RETENTION_HOURS = "6"
AGENT_METRICS_POINTS_PER_REPORT = "6"
AGENT_METRICS_R2_RETENTION_HOURS = "72"
AGENT_METRICS_PUBLIC_MAX_HOURS = "72"
AGENT_METRICS_HARD_MAX_POINTS = "4000"
AGENT_METRICS_MAX_POINTS_1H = "3600"
AGENT_METRICS_MAX_POINTS_6H = "1800"
AGENT_METRICS_MAX_POINTS_24H = "1200"
AGENT_PINGS_PUBLIC_MAX_HOURS = "72"
AGENT_PINGS_HARD_MAX_POINTS_PER_TARGET = "2000"
MISSED_BACKFILL_GRACE_SEC = "150"
STATUS_CACHE_TTL = "20"
STATUS_SNAPSHOT_EVERY_SEC = "60"
STATUS_SNAPSHOT_MAX_AGE_SEC = "150"
AGENT_METRICS_TO_D1 = "false"
AGENT_PINGS_TO_D1 = "false"
PING_HISTORY_RETENTION_HOURS = "6"
RATE_LIMIT_D1 = "true"
MISSED_WRITE_BACKFILL_MAX_BUCKETS = "6"
ALERT_MAX_MESSAGES_PER_RUN = "30"
FAST_STATUS_ENABLED = "true"
FAST_STATUS_INTERVAL_SEC = "60"
FAST_STATUS_MAX_TARGETS = "50"

[[d1_databases]]
binding = "DB"
database_name = "nstatus-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "nstatus-archive"

[[durable_objects.bindings]]
name = "REGION_PROXY"
class_name = "ProbeRegion"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProbeRegion"]
