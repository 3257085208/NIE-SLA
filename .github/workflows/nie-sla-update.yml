name: NIE-SLA Online Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_call:

permissions:
  contents: write

concurrency:
  group: nie-sla-online-update
  cancel-in-progress: false

jobs:
  update:
    name: Check and apply official update
    if: github.repository != '3257085208/NIE-SLA'
    runs-on: ubuntu-latest
    env:
      OFFICIAL_REPOSITORY: https://github.com/3257085208/NIE-SLA.git
      OFFICIAL_MANIFEST: https://raw.githubusercontent.com/3257085208/NIE-SLA/main/update-manifest.json
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve latest published version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "$OFFICIAL_MANIFEST" -o "$RUNNER_TEMP/update-manifest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';

          const manifest = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/update-manifest.json', 'utf8'));
          if (manifest.schema !== 'nie-sla-app-update-v1') throw new Error('Unsupported update manifest');
          const versionPattern = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!versionPattern.test(manifest.version || '')) throw new Error('Invalid update version');
          if (manifest.source_ref !== `app-v${manifest.version}`) throw new Error('Manifest tag mismatch');

          const source = await readFile('worker/src/version.js', 'utf8');
          const current = source.match(/VERSION\s*=\s*['"]([^'"]+)['"]/u)?.[1];
          if (!versionPattern.test(current || '')) throw new Error('Current Worker version is invalid');
          const parse = (value) => {
            const separator = value.indexOf('-');
            const core = separator < 0 ? value : value.slice(0, separator);
            const prerelease = separator < 0 ? '' : value.slice(separator + 1);
            return { core: core.split('.').map(Number), prerelease: prerelease ? prerelease.split('.') : [] };
          };
          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let index = 0; index < 3; index += 1) {
              if (a.core[index] !== b.core[index]) return a.core[index] - b.core[index];
            }
            if (!a.prerelease.length || !b.prerelease.length) {
              return a.prerelease.length === b.prerelease.length ? 0 : (a.prerelease.length ? -1 : 1);
            }
            for (let index = 0; index < Math.max(a.prerelease.length, b.prerelease.length); index += 1) {
              const x = a.prerelease[index];
              const y = b.prerelease[index];
              if (x === undefined || y === undefined) return x === undefined ? -1 : 1;
              if (x === y) continue;
              const xn = /^\d+$/.test(x);
              const yn = /^\d+$/.test(y);
              if (xn && yn) return Number(x) - Number(y);
              if (xn !== yn) return xn ? -1 : 1;
              return x > y ? 1 : -1;
            }
            return 0;
          };
          appendFileSync(process.env.GITHUB_ENV, [
            `CURRENT_VERSION=${current}`,
            `CURRENT_REF=app-v${current}`,
            `EXPECTED_VERSION=${manifest.version}`,
            `SOURCE_REF=${manifest.source_ref}`,
            `UPDATE_AVAILABLE=${compare(manifest.version, current) > 0 ? 'true' : 'false'}`,
            '',
          ].join('\n'));
          NODE

      - name: Fetch and verify official target
        if: env.UPDATE_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.jsonc || { echo "Deployment wrangler.jsonc is missing" >&2; exit 1; }
          git remote remove nie-sla-upstream 2>/dev/null || true
          git remote add nie-sla-upstream "$OFFICIAL_REPOSITORY"
          git fetch --force --no-tags nie-sla-upstream "+refs/tags/$SOURCE_REF:refs/tags/$SOURCE_REF"
          git cat-file -e "refs/tags/$SOURCE_REF^{commit}"
          git show "refs/tags/$SOURCE_REF:update-manifest.json" > "$RUNNER_TEMP/tag-update-manifest.json"
          cmp "$RUNNER_TEMP/update-manifest.json" "$RUNNER_TEMP/tag-update-manifest.json"

      - name: Verify local files and apply official snapshot
        if: env.UPDATE_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.jsonc "$RUNNER_TEMP/wrangler.deployment.jsonc"
          git config user.name "nie-sla-update[bot]"
          git config user.email "nie-sla-update[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/current-source" "$RUNNER_TEMP/target-source"
          git archive "refs/tags/$SOURCE_REF" | tar -x -C "$RUNNER_TEMP/target-source"

          # A published release tag can be re-cut (for example when a packaging
          # fix lands right after the release) while app-v<version> keeps moving
          # with the branch. Accept either official baseline so a deployment
          # created before a re-cut is not stuck without updates forever.
          baselines=("$CURRENT_REF" "v$CURRENT_VERSION")
          baseline=""
          fetched_any="false"
          diff_candidate=""
          diff_output=""
          for candidate in "${baselines[@]}"; do
            if ! git fetch --force --no-tags nie-sla-upstream "+refs/tags/$candidate:refs/tags/$candidate" 2>/dev/null; then
              continue
            fi
            fetched_any="true"
            rm -rf "$RUNNER_TEMP/current-source"
            mkdir -p "$RUNNER_TEMP/current-source"
            git archive "refs/tags/$candidate" | tar -x -C "$RUNNER_TEMP/current-source"
            # Itemized dry-run: drop entries whose only difference is the file
            # modification time (`.f..T......` and friends). A fresh checkout
            # never has the archive's timestamps, so without this filter every
            # pristine repository would be reported as "files differ".
            local_changes="$(rsync -rlpcni --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.dev.vars' \
              --exclude='wrangler.jsonc' \
              "$RUNNER_TEMP/current-source/" ./ | grep -vE '^\.(f|d|L)\.\.T\.\.\.\.' || true)"
            if [[ -z "$local_changes" ]]; then
              baseline="$candidate"
              break
            fi
            if [[ -z "$diff_candidate" ]]; then
              diff_candidate="$candidate"
              diff_output="$local_changes"
            fi
          done
          if [[ -z "$baseline" ]]; then
            if [[ "$fetched_any" == "false" ]]; then
              echo "The installed version has no online-update baseline. Perform one manual upstream sync first." >&2
              exit 1
            fi
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
              # Manual bootstrap: repositories created by the one-click deploy
              # flow can be partial copies that match no published baseline
              # (for example when CI files or other paths were never copied).
              # Only a clean, user-triggered run with no local changes at all
              # may adopt the official snapshot directly; wrangler.jsonc,
              # .github/ and .dev.vars are still preserved.
              echo "No official $CURRENT_VERSION baseline matched; adopting the official $SOURCE_REF snapshot because this is a manual bootstrap run."
              echo "Entries that will be replaced or removed (first ${diff_candidate:-unknown}):"
              printf '%s\n' "$diff_output" | head -40
              baseline="adopt:$SOURCE_REF"
            else
              echo "Deployment files differ from the official $CURRENT_VERSION baselines (first tried: $diff_candidate):" >&2
              printf '%s\n' "$diff_output" | head -80 >&2
              echo "Only wrangler.jsonc and .github may differ during an online update. Reconcile custom code manually." >&2
              exit 1
            fi
          fi
          echo "Applying update from $baseline to $SOURCE_REF"

          # Never touch .github/: repository CI configuration belongs to the
          # deployment owner, and pushes that modify workflow files are
          # rejected by GitHub, which would abort every update. Local secret
          # files (.dev.vars) are excluded as well so an update cannot delete
          # credentials that are not part of the repository.
          rsync -rlpc --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.dev.vars' \
            --exclude='wrangler.jsonc' \
            "$RUNNER_TEMP/target-source/" ./
          cp "$RUNNER_TEMP/wrangler.deployment.jsonc" wrangler.jsonc
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const source = await readFile('worker/src/version.js', 'utf8');
          const version = source.match(/VERSION\s*=\s*['"]([^'"]+)['"]/u)?.[1];
          if (version !== process.env.EXPECTED_VERSION) throw new Error(`Worker version mismatch: ${version || 'missing'}`);
          NODE

      - name: Merge official Durable Object bindings into the deployment config
        if: env.UPDATE_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const deploymentPath = 'wrangler.jsonc';
          let deployment;
          try {
            deployment = JSON.parse(readFileSync(deploymentPath, 'utf8'));
          } catch (error) {
            console.error(`Deployment wrangler.jsonc is not plain JSON (${error.message}); cannot merge bindings.`);
            process.exit(1);
          }
          const template = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/target-source/wrangler.jsonc`, 'utf8'));
          let changed = false;
          const bindings = deployment.durable_objects?.bindings ?? [];
          for (const binding of template.durable_objects?.bindings || []) {
            if (!bindings.some((existing) => existing.name === binding.name)) {
              bindings.push(binding);
              changed = true;
            }
          }
          deployment.durable_objects = { ...(deployment.durable_objects || {}), bindings };
          const migrations = deployment.migrations ?? [];
          const tags = new Set(migrations.map((migration) => migration.tag));
          for (const migration of template.migrations || []) {
            if (!tags.has(migration.tag)) {
              migrations.push(migration);
              changed = true;
            }
          }
          deployment.migrations = migrations;
          if (changed) {
            writeFileSync(deploymentPath, `${JSON.stringify(deployment, null, 2)}\n`);
            console.log('Merged official Durable Object bindings and migrations into wrangler.jsonc');
          } else {
            console.log('Deployment wrangler.jsonc already declares every official Durable Object binding');
          }
          NODE

      - name: Set up pnpm
        if: env.UPDATE_AVAILABLE == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node
        if: env.UPDATE_AVAILABLE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build, test, and validate deployment
        if: env.UPDATE_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          NIE_SLA_DEPLOYMENT_VALIDATION=1 pnpm test
          pnpm run test:update
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"

      - name: Commit verified update
        if: env.UPDATE_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit --allow-empty -m "chore: update NIE-SLA to $EXPECTED_VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report result
        shell: bash
        run: |
          if [[ "$UPDATE_AVAILABLE" == "true" ]]; then
            echo "Updated NIE-SLA from $CURRENT_VERSION to $EXPECTED_VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NIE-SLA $CURRENT_VERSION is already up to date" >> "$GITHUB_STEP_SUMMARY"
          fi
