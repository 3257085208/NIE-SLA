name: Agent CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Project verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
          rustup component add rustfmt --toolchain 1.86.0
          rustup target add --toolchain 1.86.0 x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: bash ./test.sh

  prepare-release:
    name: Prepare release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --generate-notes --title "${GITHUB_REF_NAME}"
  linux:
    name: Linux ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, prepare-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: amd64
            out: nstatus-metrics-linux-amd64
          - target: aarch64-unknown-linux-musl
            name: arm64
            out: nstatus-metrics-linux-arm64
          - target: armv7-unknown-linux-musleabihf
            name: armv7
            out: nstatus-metrics-linux-arm
          - target: armv5te-unknown-linux-musleabi
            name: armv5
            out: nstatus-metrics-linux-armv5
          - target: arm-unknown-linux-musleabi
            name: armv6
            out: nstatus-metrics-linux-armv6
          - target: i686-unknown-linux-musl
            name: 386
            out: nstatus-metrics-linux-386
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.86.0 --profile minimal
      - run: rustup target add --toolchain 1.86.0 ${{ matrix.target }}
      - working-directory: agent
        run: cargo +1.86.0 build --release --target ${{ matrix.target }}
      - working-directory: agent
        run: |
          mkdir -p bin
          cp target/${{ matrix.target }}/release/nstatus-metrics bin/${{ matrix.out }}
      - name: Upload binary to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "agent/bin/${{ matrix.out }}" --repo "${GITHUB_REPOSITORY}" --clobber

  windows:
    name: Windows amd64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, prepare-release]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.86.0 --profile minimal
      - run: rustup target add --toolchain 1.86.0 x86_64-pc-windows-msvc
      - working-directory: agent
        run: cargo +1.86.0 build --release --target x86_64-pc-windows-msvc
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force agent/bin | Out-Null
          Copy-Item agent/target/x86_64-pc-windows-msvc/release/nstatus-metrics.exe agent/bin/nstatus-metrics-windows-amd64.exe
      - name: Upload binary to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "agent/bin/nstatus-metrics-windows-amd64.exe" --repo "$env:GITHUB_REPOSITORY" --clobber

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, prepare-release, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern 'nstatus-metrics-*' --dir bin
      - name: Generate release manifest
        run: |
          cd bin
          sha256sum nstatus-metrics-* > SHA256SUMS
          printf '%s\n' "${GITHUB_REF_NAME}" > VERSION
          sha256sum -c SHA256SUMS
          ls -lh
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" bin/SHA256SUMS bin/VERSION --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
