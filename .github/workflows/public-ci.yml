name: Public Snapshot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Desensitized snapshot verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
          rustup component add rustfmt --toolchain 1.86.0
          rustup target add --toolchain 1.86.0 x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: bash ./test.sh
